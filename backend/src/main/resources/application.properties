spring.application.name=musiclib

# H2 In-Memory Database (MySQL Mode for zero-config local execution)
spring.datasource.url=jdbc:h2:mem:musiclib;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT
jwt.secret=MusicLibSecretKey2024SuperSecureRandomStringForJWTSigningPurposes256Bit
jwt.expiration=86400000

# iTunes API
itunes.api.base-url=https://itunes.apple.com

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.com.musiclib=INFO
logging.level.org.springframework.security=WARN
